[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haas-atlas-explorer-service"
version = "0.1.0"
description = "Standalone Atlas Explorer workspace service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
