x-app-env: &app-env
  HAAS_PROFILE: ${HAAS_PROFILE:-dev}
  HAAS_SECRET_ENCRYPTION_KEY: ${HAAS_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  HAAS_MAX_REQUEST_BODY_BYTES: ${HAAS_MAX_REQUEST_BODY_BYTES:-1048576}
  HAAS_MAX_PROMPT_CHARS: ${HAAS_MAX_PROMPT_CHARS:-32000}
  POSTGRES_DSN: postgresql://haas:haas_dev_password@postgres:5432/haas_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PLUGINS_DIR: /app/plugins
  PLUGINS_ALLOW: ${PLUGINS_ALLOW:-}
  PLUGINS_DENY: ${PLUGINS_DENY:-}
  PLUGINS_EXTRA_DIRS: ${PLUGINS_EXTRA_DIRS:-}
  PLUGINS_STRICT: ${PLUGINS_STRICT:-false}
  SKILLS_PROMPT_MAX_CHARS: ${SKILLS_PROMPT_MAX_CHARS:-6000}
  TENANT_SKILL_ALLOWLISTS: ${TENANT_SKILL_ALLOWLISTS:-}
  BILLING_MCP_URL: ${BILLING_MCP_URL:-https://mcp.billing.example.com/mcp}
  BILLING_WEBHOOK_URL: ${BILLING_WEBHOOK_URL:-https://billing.example.com/hooks/refund-batches}
  OUTPUT_DELTA_ENABLED: ${OUTPUT_DELTA_ENABLED:-false}
  # CORS settings for frontend integration
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000,http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173}
  CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-*}
  CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-*}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
  CORS_MAX_AGE: ${CORS_MAX_AGE:-86400}

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haas
      POSTGRES_PASSWORD: haas_dev_password
      POSTGRES_DB: haas_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haas -d haas_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  migrate:
    build: .
    image: haas-distributed:3.0.0
    command: python -m app.migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  haas-api:
    build: .
    image: haas-distributed:3.0.0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "${HAAS_API_BIND_ADDRESS:-0.0.0.0}:${HAAS_API_PORT:-8000}:8000"
    environment:
      <<: *app-env
      # The API stamps these defaults on every run it creates (the workers only obey them).
      DEFAULT_PRIMARY_MODEL: ${DEFAULT_PRIMARY_MODEL:-deepseek/deepseek-chat-v3-0324}
      DEFAULT_PLANNER_MODEL: ${DEFAULT_PLANNER_MODEL:-deepseek/deepseek-r1}
      FLOWER_ENABLED: ${FLOWER_ENABLED:-false}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    volumes:
      - ./plugins:/app/plugins:ro
      - scratchpad_vol:/tmp/haas_scratchpad
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Orchestrator worker: holds OPENROUTER_API_KEY, never runs arbitrary tool code
  worker-orchestrator:
    image: haas-distributed:3.0.0
    command: >
      celery -A app.worker.celery_app worker
      -Q q_orchestrator
      -c 8
      --loglevel=INFO
      -n orchestrator@%h
    environment:
      <<: *app-env
      HAAS_WORKER_ROLE: orchestrator
      # Ed25519 seed that signs tool envelopes; blank = development key (dev profile only).
      HAAS_ENVELOPE_SIGNING_KEY: ${HAAS_ENVELOPE_SIGNING_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-sk-or-v1-replace-me}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      DEFAULT_PRIMARY_MODEL: ${DEFAULT_PRIMARY_MODEL:-deepseek/deepseek-chat-v3-0324}
      DEFAULT_PLANNER_MODEL: ${DEFAULT_PLANNER_MODEL:-deepseek/deepseek-r1}
    volumes:
      - ./plugins:/app/plugins:ro
      - scratchpad_vol:/tmp/haas_scratchpad
    depends_on:
      haas-api:
        condition: service_healthy

  # Isolated tool worker: NO OpenRouter key, no signing key,
  # dropped capabilities, read-only rootfs
  # Has PostgreSQL DSN for atlas_entity_cache and other tool database access
  worker-tools:
    image: haas-distributed:3.0.0
    command: >
      celery -A app.worker.celery_app worker
      -Q q_tools_fast,q_tools_sandbox
      -c 8
      --loglevel=INFO
      -n tools@%h
    environment:
      HAAS_PROFILE: ${HAAS_PROFILE:-dev}
      HAAS_WORKER_ROLE: tools
      # Verify-only public key: tool workers can check, never mint, dispatch envelopes.
      HAAS_ENVELOPE_VERIFY_KEY: ${HAAS_ENVELOPE_VERIFY_KEY:-}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://haas:haas_dev_password@postgres:5432/haas_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PLUGINS_DIR: /app/plugins
      PLUGINS_ALLOW: ${PLUGINS_ALLOW:-}
      PLUGINS_DENY: ${PLUGINS_DENY:-}
      PLUGINS_EXTRA_DIRS: ${PLUGINS_EXTRA_DIRS:-}
      PLUGINS_STRICT: ${PLUGINS_STRICT:-false}
      BILLING_MCP_URL: ${BILLING_MCP_URL:-https://mcp.billing.example.com/mcp}
      BILLING_WEBHOOK_URL: ${BILLING_WEBHOOK_URL:-https://billing.example.com/hooks/refund-batches}
      # Self-hosted SearXNG used by the web-research plugin's `web_search` tool.
      # The `searxng` service is defined by plugins/web-research/docker-compose.yml.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # SSRF guard allowlist: the tool worker calls SearXNG by Docker DNS service name,
      # which resolves to a private address; allowlist it so validate_safe_outbound_url passes.
      SSRF_ALLOWED_HOSTS: ${SSRF_ALLOWED_HOSTS:-searxng}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - ./plugins:/app/plugins:ro
      - scratchpad_vol:/tmp/haas_scratchpad
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  pg_data:
  scratchpad_vol:
