{{- range $component := list "api" "orchestrator" "tool-worker" "maintenance" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "haas.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "haas.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
{{- end }}
