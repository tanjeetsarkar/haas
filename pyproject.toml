[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haas-distributed"
version = "3.0.0"
description = "Distributed FastAPI + Celery Canvas + Redis Harness-as-a-Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "flower>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "textual>=0.86"]
tui = ["textual>=0.86"]

[project.scripts]
haas-chat = "haas_cli.chat:main"
haas-plugin = "haas_cli.plugin:main"

# The repo root also holds plugins/ and tests/, which setuptools' flat-layout
# auto-discovery would reject as "multiple top-level packages".
[tool.setuptools.packages.find]
include = ["app*", "haas_cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Templates contain `{{placeholders}}` and are not valid Python until scaffolded.
extend-exclude = ["plugins/_templates"]
