[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haas-distributed"
version = "3.0.0"
description = "Distributed FastAPI + Celery Canvas + Redis Harness-as-a-Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "celery[redis]>=5.4.0",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "PyJWT[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "flower>=2.0.1",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-celery>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0.0",
    "textual>=0.86",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pip-audit>=2.7.0",
    "openai>=1.40",
    "jsonschema>=4.23",
]
tui = ["textual>=0.86"]

[project.scripts]
haas = "haas_cli.cli:main"
haas-chat = "haas_cli.chat:main"
haas-plugin = "haas_cli.plugin:main"
haas-bootstrap-tenant = "app.bootstrap_tenant:main"

# The repo root also holds plugins/ and tests/, which setuptools' flat-layout
# auto-discovery would reject as "multiple top-level packages".
[tool.setuptools.packages.find]
include = ["app*", "haas_cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Templates contain `{{placeholders}}` and are not valid Python until scaffolded.
extend-exclude = ["plugins/_templates"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["app", "haas_cli", "migrations", "scripts"]
exclude = ["plugins/_templates", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Shared PostgreSQL fixtures are re-exported from test_phase2_database and used as parameters.
"tests/test_multi_agent_schema.py" = ["F811"]
