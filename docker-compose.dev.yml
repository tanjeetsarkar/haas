services:
  haas-api:
    environment:
      FLOWER_ENABLED: ${FLOWER_ENABLED:-true}

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  flower:
    image: haas-distributed:3.0.0
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    depends_on:
      redis:
        condition: service_healthy
